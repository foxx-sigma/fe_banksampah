<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  shape-rendering="crispEdges"
>
  <!--
    Pixel-art cursor accent (PRD-LANDING.md section 6).
    Referensi gaya: Streamline Pixel icon set - dipakai TERBATAS sebagai
    aksen cursor kustom saat hover di CTA utama Hero, bukan pengganti
    ikon sistem. Grid 8x8, tiap sel = 4x4 unit. Palet: hitam (outline),
    putih (fill), teal #0D9488 (aksen ekor panah).
    Hotspot cursor ada di (0,0) - ujung kiri-atas - supaya perilaku
    pointer tetap presisi seperti cursor biasa.
  -->
  <rect x="0" y="0" width="4" height="4" fill="#000000" />

  <rect x="0" y="4" width="4" height="4" fill="#000000" />
  <rect x="4" y="4" width="4" height="4" fill="#000000" />

  <rect x="0" y="8" width="4" height="4" fill="#000000" />
  <rect x="4" y="8" width="4" height="4" fill="#ffffff" />
  <rect x="8" y="8" width="4" height="4" fill="#000000" />

  <rect x="0" y="12" width="4" height="4" fill="#000000" />
  <rect x="4" y="12" width="4" height="4" fill="#ffffff" />
  <rect x="8" y="12" width="4" height="4" fill="#ffffff" />
  <rect x="12" y="12" width="4" height="4" fill="#000000" />

  <rect x="0" y="16" width="4" height="4" fill="#000000" />
  <rect x="4" y="16" width="4" height="4" fill="#ffffff" />
  <rect x="8" y="16" width="4" height="4" fill="#ffffff" />
  <rect x="12" y="16" width="4" height="4" fill="#ffffff" />
  <rect x="16" y="16" width="4" height="4" fill="#000000" />

  <rect x="0" y="20" width="4" height="4" fill="#000000" />
  <rect x="4" y="20" width="4" height="4" fill="#ffffff" />
  <rect x="8" y="20" width="4" height="4" fill="#ffffff" />
  <rect x="12" y="20" width="4" height="4" fill="#ffffff" />
  <rect x="16" y="20" width="4" height="4" fill="#ffffff" />
  <rect x="20" y="20" width="4" height="4" fill="#000000" />

  <rect x="0" y="24" width="4" height="4" fill="#000000" />
  <rect x="4" y="24" width="4" height="4" fill="#ffffff" />
  <rect x="8" y="24" width="4" height="4" fill="#0d9488" />
  <rect x="12" y="24" width="4" height="4" fill="#0d9488" />
  <rect x="16" y="24" width="4" height="4" fill="#000000" />

  <rect x="0" y="28" width="4" height="4" fill="#0d9488" />
  <rect x="4" y="28" width="4" height="4" fill="#000000" />
</svg>
